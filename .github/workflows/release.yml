name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run tests
        run: zig build test

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build ReleaseFast (x86_64-windows)
        run: zig build -Dtarget=x86_64-windows -Doptimize=ReleaseFast

      - name: Upload zrrp.exe
        uses: actions/upload-artifact@v4
        with:
          name: zrrp-x86_64-windows
          path: zig-out/bin/zrrp.exe
          if-no-files-found: error

  release:
    needs: [test, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zrrp-x86_64-windows

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" zrrp.exe --generate-notes
